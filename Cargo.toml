[package]
name = "inland-empire"
version = "0.1.0"
edition = "2021"
description = "Disco Elysium skill check system for Claude Code"
license = "MIT"
repository = "https://github.com/Fr0do/inland-empire"

[[bin]]
name = "ie"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "=4.5.23", features = ["derive"] }
colored = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

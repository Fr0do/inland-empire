[package]
name = "inland-empire"
version = "0.11.0"
edition = "2021"
description = "Disco Elysium skill check system for Claude Code"
license = "MIT"
repository = "https://github.com/Fr0do/inland-empire"

[[bin]]
name = "ie"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
tiny_http = "0.12"
open = "5"
toml = { version = "0.8", features = ["preserve_order"] }
